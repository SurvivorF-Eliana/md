<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeoMark v04 · Advanced Markdown Workspace</title>
    <!-- Host Grotesk & JetBrains Mono Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Marked.js Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    
    <style>
        /* ===== CSS Variables — Host Grotesk + Sci-Fi Industrial ===== */
        :root {
            --bg: #07070a;
            --bg-secondary: #0e0e14;
            --bg-card: #15151e;
            --bg-hover: #1c1c28;
            --text: #e4e4ec;
            --text-secondary: #9898ac;
            --text-muted: #55556a;
            --primary: #00c4e0;
            --primary-dim: rgba(0, 196, 224, 0.15);
            --primary-glow: rgba(0, 196, 224, 0.08);
            --secondary: #9b59d0;
            --secondary-dim: rgba(155, 89, 208, 0.12);
            --border: #22222e;
            --border-light: #2e2e3c;
            --radius: 6px;
            --transition: 0.18s ease;
            --font: 'Host Grotesk', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --toolbar-bg: #0c0c12;
        }

        .light {
            --bg: #f4f4f8;
            --bg-secondary: #e6e6ee;
            --bg-card: #ffffff;
            --bg-hover: #dcdce6;
            --text: #1a1a24;
            --text-secondary: #4a4a5c;
            --text-muted: #7a7a8c;
            --primary: #007a9a;
            --primary-dim: rgba(0, 122, 154, 0.12);
            --primary-glow: rgba(0, 122, 154, 0.06);
            --secondary: #7a3aa0;
            --secondary-dim: rgba(122, 58, 160, 0.1);
            --border: #c8c8d4;
            --border-light: #d4d4e0;
            --toolbar-bg: #e0e0e8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            font-weight: 400;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            transition: background var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* ===== Header ===== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            height: 52px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font);
        }
        .logo .icon {
            font-size: 16px;
            color: var(--primary);
            width: 30 h-30;
            height: 30px;
            border-radius: 6px;
            background: var(--primary-dim);
            border: 1px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo .title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .logo .badge-ver {
            font-size: 10px;
            font-family: var(--font-mono);
            background: var(--primary-dim);
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 14px;
            width: 34px;
            height: 34px;
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }
        .btn-icon:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-dim); }
        .btn-primary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: var(--radius);
            font-family: var(--font);
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-dim); }

        /* ===== Main Layout ===== */
        main { display: flex; height: calc(100vh - 52px); overflow: hidden; }

        /* ===== Sidebar ===== */
        #sidebar {
            width: 240px;
            min-width: 170px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: all var(--transition);
            flex-shrink: 0;
            overflow: hidden;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header #fileCount {
            color: var(--primary);
            background: var(--primary-dim);
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        #fileList { flex: 1; overflow-y: auto; padding: 6px; }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            margin-bottom: 2px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all var(--transition);
            border-left: 3px solid transparent;
            background: transparent;
            color: var(--text-secondary);
        }
        .file-item:hover { background: var(--bg-hover); color: var(--text); }
        .file-item.active { background: var(--bg-card); border-left-color: var(--primary); color: var(--text); font-weight: 600; }
        .file-item .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .file-item .del {
            background: transparent; border: none; color: var(--text-muted); font-size: 13px;
            cursor: pointer; padding: 0 4px; opacity: 0; transition: all var(--transition);
        }
        .file-item:hover .del { opacity: 0.6; }
        .file-item .del:hover { color: #f43f5e; opacity: 1; }
        
        .drop-zone {
            margin: 8px 10px 12px;
            padding: 14px 8px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .drop-zone:hover, .drop-zone.drag-over { border-color: var(--primary); background: var(--primary-dim); color: var(--primary); }

        /* ===== Workspace ===== */
        #workspace { flex: 1; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
        .workspace-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 42px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 8px;
        }
        .workspace-header .file-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* COOL FEATURE: HUD METRICS BAR */
        .hud-metrics {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .workspace-actions { display: flex; gap: 4px; }
        .btn-mode {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn-mode:hover { color: var(--text-secondary); border-color: var(--border); }
        .btn-mode.active { background: var(--bg-card); color: var(--primary); border-color: var(--border); }

        /* ===== Toolbar ===== */
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            padding: 6px 12px;
            background: var(--toolbar-bg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            align-items: center;
        }
        #toolbar button, #toolbar select {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 28px;
        }
        #toolbar button:hover { background: var(--bg-hover); color: var(--primary); border-color: var(--border); }
        #toolbar .separator { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }

        /* ===== Workspace Content ===== */
        #workspaceContent { flex: 1; overflow: hidden; display: flex; background: var(--bg); }
        
        .editor-panel {
            display: flex;
            flex: 1;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--bg-secondary);
        }
        .editor-panel textarea {
            flex: 1;
            width: 100%;
            background: var(--bg);
            color: var(--text);
            border: none;
            padding: 20px;
            font-family: var(--font-mono);
            font-size: 13.5px;
            line-height: 1.65;
            resize: none;
            outline: none;
            transition: background var(--transition), color var(--transition);
        }

        .preview-panel {
            flex: 1;
            overflow-y: auto;
            padding: 32px 40px;
            background: var(--bg);
            font-family: var(--font);
            color: var(--text);
            line-height: 1.75;
            font-size: 15px;
        }
        .preview-panel h1, .preview-panel h2, .preview-panel h3,
        .preview-panel h4, .preview-panel h5, .preview-panel h6 {
            font-family: var(--font);
            font-weight: 700;
            margin-top: 1.6em;
            margin-bottom: 0.4em;
            color: var(--text);
        }
        .preview-panel h1 { font-size: 1.95rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35em; color: var(--primary); }
        .preview-panel h2 { font-size: 1.45rem; }
        .preview-panel h3 { font-size: 1.2rem; color: var(--text-secondary); }
        .preview-panel p { margin: 0.8em 0; }
        .preview-panel a { color: var(--primary); text-decoration: none; border-bottom: 1px solid transparent; }
        .preview-panel a:hover { border-bottom-color: var(--primary); }
        .preview-panel blockquote {
            border-left: 3px solid var(--primary);
            padding: 0.6em 1.2em;
            margin: 1em 0;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            border-radius: 0 var(--radius) var(--radius) 0;
        }
        .preview-panel code {
            font-family: var(--font-mono);
            background: var(--bg-card);
            padding: 0.15em 0.4em;
            border-radius: 3px;
            font-size: 0.88em;
            border: 1px solid var(--border);
        }
        .preview-panel pre {
            background: var(--bg-card);
            padding: 1.1em 1.3em;
            border-radius: var(--radius);
            overflow-x: auto;
            border: 1px solid var(--border);
            margin: 1.2em 0;
        }
        .preview-panel pre code { background: transparent; border: none; padding: 0; }
        .preview-panel table { border-collapse: collapse; width: 100%; margin: 1.2em 0; font-size: 0.92em; }
        .preview-panel th, .preview-panel td { border: 1px solid var(--border); padding: 0.6em 1em; }
        .preview-panel th { background: var(--bg-secondary); color: var(--text-secondary); font-weight: 600; }

        /* Mode Layout Classes */
        .mode-view .editor-panel { display: none !important; }
        .mode-view .preview-panel { display: block !important; flex: 1; }
        .mode-edit .editor-panel { display: flex !important; flex: 1; }
        .mode-edit .preview-panel { display: none !important; }
        .mode-split .editor-panel { display: flex !important; flex: 1; }
        .mode-split .preview-panel { display: block !important; flex: 1; }

        /* Table of Contents Drawer */
        #tocDrawer {
            position: absolute; right: 20px; top: 105px; width: 260px; max-height: 70vh;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 50; overflow-y: auto;
            display: none; font-size: 12px;
        }
        #tocDrawer h4 { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; font-family: var(--font-mono); }
        #tocList a { display: block; color: var(--text-secondary); text-decoration: none; padding: 3px 0; font-family: var(--font); }
        #tocList a:hover { color: var(--primary); }

        .welcome {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; text-align: center; padding: 40px; color: var(--text-secondary); width: 100%;
        }
        .welcome .big-icon { font-size: 36px; margin-bottom: 14px; color: var(--primary); }
    </style>
</head>
<body class="mode-split">

<header>
    <div class="logo">
        <div class="icon"><i class="fa-solid fa-cube"></i></div>
        <span class="title">NeoMark</span>
        <span class="badge-ver">v04 Host</span>
    </div>
    <div class="header-actions">
        <!-- Template Injector Dropdown -->
        <select id="templateSelect" class="btn-primary" style="background:var(--bg-card); font-size:12px;">
            <option value="">+ Template...</option>
            <option value="readme">GitHub README</option>
            <option value="report">Diagnostic Report</option>
            <option value="api">API Documentation</option>
            <option value="changelog">Changelog</option>
        </select>
        
        <button id="themeToggle" class="btn-icon" title="Toggle Theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
        <button id="tocBtn" class="btn-icon" title="Table of Contents"><i class="fa-solid fa-list-ul"></i></button>
        <button id="newBtn" class="btn-primary"><i class="fa-solid fa-plus"></i> Nuevo</button>
        <button id="loadBtn" class="btn-primary"><i class="fa-solid fa-folder-open"></i> Cargar .md</button>
        <input type="file" id="fileInput" multiple accept=".md,.markdown,text/markdown" style="display:none" />
    </div>
</header>

<main>
    <!-- Sidebar -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <span>Archivos</span>
            <span id="fileCount">0</span>
        </div>
        <div id="fileList"></div>
        <div class="drop-zone" id="dropZone">
            <i class="fa-solid fa-cloud-arrow-up text-lg mb-1 block"></i>
            <span>Arrastrar .md</span>
        </div>
    </aside>

    <!-- Workspace -->
    <section id="workspace">
        <div class="workspace-header">
            <div class="file-label" id="currentFileLabel">
                <span id="currentFileName">Ninguno</span>
            </div>

            <!-- LIVE HUD METRICS (Words, Chars, Read time) -->
            <div class="hud-metrics" id="hudMetrics">
                <span><i class="fa-solid fa-font text-blue-400 mr-1"></i> <strong id="hudWords">0</strong> words</span>
                <span><i class="fa-solid fa-i-cursor text-emerald-400 mr-1"></i> <strong id="hudChars">0</strong> chars</span>
                <span><i class="fa-solid fa-clock text-amber-400 mr-1"></i> <strong id="hudTime">0m</strong> read</span>
            </div>

            <div class="workspace-actions">
                <button class="btn-mode" id="viewModeBtn">Vista</button>
                <button class="btn-mode active" id="splitModeBtn">Split</button>
                <button class="btn-mode" id="editModeBtn">Editar</button>
            </div>
        </div>

        <!-- Format Toolbar -->
        <div id="toolbar">
            <button data-format="bold" title="Bold"><strong>B</strong></button>
            <button data-format="italic" title="Italic"><em>I</em></button>
            <button data-format="strike" title="Strikethrough"><s>S</s></button>
            <span class="separator"></span>
            <button data-format="h1">H1</button>
            <button data-format="h2">H2</button>
            <button data-format="h3">H3</button>
            <span class="separator"></span>
            <button data-format="ul">• List</button>
            <button data-format="ol">1. List</button>
            <button data-format="checklist">☐ Check</button>
            <span class="separator"></span>
            <button data-format="blockquote"><i class="fa-solid fa-quote-left"></i></button>
            <button data-format="code">{ }</button>
            <button data-format="codeblock"><i class="fa-solid fa-code"></i></button>
            <button data-format="table"><i class="fa-solid fa-table"></i></button>
            <span class="separator"></span>
            <button data-format="link"><i class="fa-solid fa-link"></i></button>
            <button data-format="image"><i class="fa-solid fa-image"></i></button>
            
            <div style="margin-left: auto; display: flex; gap: 4px;">
                <button id="copyHtmlBtn" title="Copy Formatted HTML"><i class="fa-solid fa-copy"></i> HTML</button>
                <button id="exportMdBtn" title="Download .md"><i class="fa-solid fa-download"></i> Export</button>
            </div>
        </div>

        <div id="workspaceContent">
            <!-- Welcome Placeholder -->
            <div class="welcome" id="welcomePlaceholder">
                <div class="big-icon"><i class="fa-solid fa-layer-group"></i></div>
                <h2 class="text-lg font-bold text-white uppercase tracking-wider">NeoMark v04 Host</h2>
                <p class="text-xs text-zinc-500 mt-2 max-w-sm">Cargá archivos .md, arrastrá documentos o usá los plantillas integradas.</p>
            </div>

            <!-- Editor Panel -->
            <div class="editor-panel" style="display:none;">
                <textarea id="editorTextarea" placeholder="Escribí o pegá tu código Markdown aquí..."></textarea>
            </div>

            <!-- Preview Panel -->
            <div class="preview-panel" id="previewPanel"></div>
        </div>
    </section>

    <!-- Table of Contents Drawer -->
    <div id="tocDrawer">
        <h4><i class="fa-solid fa-compass mr-1"></i> Document Outline</h4>
        <div id="tocList"></div>
    </div>
</main>

<script>
    (function() {
        'use strict';

        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
                return hljs.highlightAuto(code).value;
            },
            breaks: true, gfm: true
        });

        const state = { files: {}, selected: null, mode: 'split', theme: 'dark' };
        const STORAGE_KEY = 'neomark_session_v04';

        const $ = s => document.querySelector(s);
        const fileListEl = $('#fileList');
        const fileCountEl = $('#fileCount');
        const dropZone = $('#dropZone');
        const fileInput = $('#fileInput');
        const loadBtn = $('#loadBtn');
        const newBtn = $('#newBtn');
        const themeToggle = $('#themeToggle');
        const previewPanel = $('#previewPanel');
        const editorTextarea = $('#editorTextarea');
        const currentFileName = $('#currentFileName');
        const welcomePlaceholder = $('#welcomePlaceholder');
        const viewModeBtn = $('#viewModeBtn');
        const splitModeBtn = $('#splitModeBtn');
        const editModeBtn = $('#editModeBtn');
        const toolbar = $('#toolbar');
        const templateSelect = $('#templateSelect');
        const tocBtn = $('#tocBtn');
        const tocDrawer = $('#tocDrawer');
        const tocList = $('#tocList');

        function saveSession() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    files: state.files, selected: state.selected, theme: state.theme, mode: state.mode
                }));
            } catch (e) {}
        }

        function loadSession() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return false;
                const data = JSON.parse(raw);
                state.files = data.files || {};
                state.selected = data.selected || null;
                state.theme = data.theme || 'dark';
                state.mode = data.mode || 'split';
                if (state.theme === 'light') document.body.classList.add('light');
                return Object.keys(state.files).length > 0;
            } catch (e) { return false; }
        }

        function updateHUD(text) {
            if (!text) {
                $('#hudWords').textContent = '0';
                $('#hudChars').textContent = '0';
                $('#hudTime').textContent = '0m';
                return;
            }
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            const readTime = Math.max(1, Math.ceil(words / 200));

            $('#hudWords').textContent = words.toLocaleString();
            $('#hudChars').textContent = chars.toLocaleString();
            $('#hudTime').textContent = `${readTime}m`;
        }

        function generateTOC() {
            const headings = previewPanel.querySelectorAll('h1, h2, h3');
            tocList.innerHTML = '';
            if (!headings.length) {
                tocList.innerHTML = '<span class="text-zinc-500">No headings found</span>';
                return;
            }
            headings.forEach((h, idx) => {
                const id = `heading-${idx}`;
                h.id = id;
                const a = document.createElement('a');
                a.href = `#${id}`;
                a.textContent = h.textContent;
                a.style.paddingLeft = h.tagName === 'H2' ? '10px' : h.tagName === 'H3' ? '20px' : '0px';
                a.onclick = (e) => {
                    e.preventDefault();
                    h.scrollIntoView({ behavior: 'smooth' });
                };
                tocList.appendChild(a);
            });
        }

        function applyMode(mode) {
            state.mode = mode;
            document.body.className = `mode-${mode} ${state.theme}`;
            viewModeBtn.classList.toggle('active', mode === 'view');
            splitModeBtn.classList.toggle('active', mode === 'split');
            editModeBtn.classList.toggle('active', mode === 'edit');
            saveSession();
        }

        function renderPreview(md) {
            if (!md || md.trim() === '') {
                previewPanel.innerHTML = `<div style="color:var(--text-muted);padding:40px;text-align:center;font-size:13px;">Empty file</div>`;
                updateHUD('');
                return;
            }
            try {
                previewPanel.innerHTML = marked.parse(md);
                previewPanel.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                updateHUD(md);
                generateTOC();
            } catch (e) {
                previewPanel.innerHTML = `<div style="color:#f43f5e;padding:20px;">Render Error: ${e.message}</div>`;
            }
        }

        function selectFile(key) {
            if (!state.files[key]) return;
            state.selected = key;
            renderFileList();
            const f = state.files[key];
            currentFileName.textContent = f.name;
            welcomePlaceholder.style.display = 'none';
            editorTextarea.value = f.content;
            renderPreview(f.content);
            applyMode(state.mode);
            saveSession();
        }

        function createNewFile(name = 'document.md', content = '') {
            let key = name;
            let counter = 1;
            while (state.files[key]) { key = `document_${counter}.md`; counter++; }
            state.files[key] = { name: key, content: content };
            renderFileList();
            selectFile(key);
            applyMode('split');
            saveSession();
        }

        function renderFileList() {
            const keys = Object.keys(state.files);
            fileCountEl.textContent = keys.length;
            if (!keys.length) { fileListEl.innerHTML = '<div style="padding:15px;color:var(--text-muted);font-size:12px;text-align:center;">Sin archivos</div>'; return; }
            let html = '';
            keys.forEach(k => {
                const active = k === state.selected ? 'active' : '';
                html += `<div class="file-item ${active}" data-key="${k}">
                    <span class="name"><i class="fa-regular fa-file-lines mr-1.5 text-zinc-500"></i>${k}</span>
                    <button class="del" data-key="${k}">×</button>
                </div>`;
            });
            fileListEl.innerHTML = html;
            fileListEl.querySelectorAll('.file-item').forEach(item => {
                item.onclick = (e) => { if (!e.target.classList.contains('del')) selectFile(item.dataset.key); };
                item.querySelector('.del').onclick = (e) => {
                    e.stopPropagation();
                    delete state.files[item.dataset.key];
                    if (state.selected === item.dataset.key) state.selected = null;
                    renderFileList();
                    if (Object.keys(state.files).length) selectFile(Object.keys(state.files)[0]);
                    else welcomePlaceholder.style.display = 'flex';
                    saveSession();
                };
            });
        }

        function loadFiles(files) {
            Array.from(files).forEach(f => {
                const reader = new FileReader();
                reader.onload = e => {
                    state.files[f.name] = { name: f.name, content: e.target.result };
                    renderFileList();
                    selectFile(f.name);
                };
                reader.readAsText(f);
            });
        }

        // Event Listeners
        loadBtn.onclick = () => fileInput.click();
        newBtn.onclick = () => createNewFile();
        fileInput.onchange = e => loadFiles(e.target.files);

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('drag-over'); };
        dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
        dropZone.ondrop = e => { e.preventDefault(); dropZone.classList.remove('drag-over'); loadFiles(e.dataTransfer.files); };

        viewModeBtn.onclick = () => applyMode('view');
        splitModeBtn.onclick = () => applyMode('split');
        editModeBtn.onclick = () => applyMode('edit');

        themeToggle.onclick = () => {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            applyMode(state.mode);
        };

        tocBtn.onclick = () => {
            tocDrawer.style.display = tocDrawer.style.display === 'block' ? 'none' : 'block';
        };

        editorTextarea.oninput = () => {
            if (state.selected) {
                const val = editorTextarea.value;
                state.files[state.selected].content = val;
                renderPreview(val);
                saveSession();
            }
        };

        $('#copyHtmlBtn').onclick = () => {
            navigator.clipboard.writeText(previewPanel.innerHTML).then(() => alert("HTML copied to clipboard!"));
        };

        $('#exportMdBtn').onclick = () => {
            if (!state.selected) return;
            const blob = new Blob([state.files[state.selected].content], { type: 'text/markdown' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = state.selected;
            a.click();
        };

        templateSelect.onchange = () => {
            const val = templateSelect.value;
            if (!val) return;
            let tpl = '';
            if (val === 'readme') {
                tpl = `# Project Name\n\n> Short description of the project.\n\n## Features\n- Feature 1\n- Feature 2\n\n## Installation\n\`\`\`bash\nnpm install project\n\`\`\`\n`;
            } else if (val === 'report') {
                tpl = `# DIAGNOSTIC REPORT\n**Date:** ${new Date().toISOString().split('T')[0]}\n\n## Executive Summary\n| Status | Module | Issue |\n| :--- | :--- | :--- |\n| 🔴 CRITICAL | Core | Memory Leak |\n`;
            }
            createNewFile(`${val}_template.md`, tpl);
            templateSelect.value = '';
        };

        // Format Toolbar Actions
        toolbar.querySelectorAll('button[data-format]').forEach(btn => {
            btn.onclick = () => {
                const fmt = btn.dataset.format;
                const ta = editorTextarea;
                const start = ta.selectionStart;
                const end = ta.selectionEnd;
                const sel = ta.value.substring(start, end);
                let rep = '';
                if (fmt === 'bold') rep = `**${sel || 'bold text'}**`;
                else if (fmt === 'italic') rep = `*${sel || 'italic text'}*`;
                else if (fmt === 'h1') rep = `# ${sel || 'Heading 1'}`;
                else if (fmt === 'h2') rep = `## ${sel || 'Heading 2'}`;
                else if (fmt === 'h3') rep = `### ${sel || 'Heading 3'}`;
                else if (fmt === 'ul') rep = `- ${sel || 'list item'}`;
                else if (fmt === 'ol') rep = `1. ${sel || 'ordered item'}`;
                else if (fmt === 'checklist') rep = `- [ ] ${sel || 'task'}`;
                else if (fmt === 'table') rep = `\n| Header 1 | Header 2 |\n| :--- | :--- |\n| Value 1 | Value 2 |\n`;
                else if (fmt === 'codeblock') rep = `\`\`\`javascript\n${sel || '// code here'}\n\`\`\``;
                else if (fmt === 'link') rep = `[${sel || 'link text'}](https://example.com)`;

                ta.value = ta.value.substring(0, start) + rep + ta.value.substring(end);
                if (state.selected) {
                    state.files[state.selected].content = ta.value;
                    renderPreview(ta.value);
                    saveSession();
                }
            };
        });

        // Init
        const restored = loadSession();
        if (restored && state.selected && state.files[state.selected]) {
            renderFileList();
            selectFile(state.selected);
        } else {
            renderFileList();
            applyMode('split');
        }
    })();
</script>
</body>
</html>
