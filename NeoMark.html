<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeoMark · Advanced Markdown</title>
    <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/229836307?s=400&u=af2147593dc3ad183171b470e8daa410e53de744&v=4" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <style>
        /* ===== Variables ===== */
        :root {
            --bg: #07070a;
            --bg-secondary: #0e0e14;
            --bg-card: #15151e;
            --bg-hover: #1c1c28;
            --text: #e4e4ec;
            --text-secondary: #9898ac;
            --text-muted: #55556a;
            --primary: #00c4e0;
            --primary-dim: rgba(0, 196, 224, 0.15);
            --border: #22222e;
            --border-light: #2e2e3c;
            --radius: 6px;
            --font: 'Host Grotesk', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --toolbar-bg: #0c0c12;
        }

        .light {
            --bg: #f4f4f8;
            --bg-secondary: #e6e6ee;
            --bg-card: #ffffff;
            --bg-hover: #dcdce6;
            --text: #1a1a24;
            --text-secondary: #4a4a5c;
            --text-muted: #7a7a8c;
            --primary: #007a9a;
            --primary-dim: rgba(0, 122, 154, 0.12);
            --border: #c8c8d4;
            --border-light: #d4d4e0;
            --toolbar-bg: #e0e0e8;
        }

        /* ===== Estilos base ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            font-weight: 400;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            transition: background 0.2s, color 0.2s;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* ===== Header ===== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            height: 52px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo .icon {
            font-size: 16px;
            color: var(--primary);
            width: 30px;
            height: 30px;
            border-radius: var(--radius);
            background: var(--primary-dim);
            border: 1px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo .title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .logo .badge-ver {
            font-size: 10px;
            font-family: var(--font-mono);
            background: var(--primary-dim);
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 14px;
            width: 34px;
            height: 34px;
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s;
        }
        .btn-icon:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-dim);
        }
        .btn-primary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: var(--radius);
            font-family: var(--font);
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.18s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-dim);
        }

        /* ===== Main Layout ===== */
        main {
            display: flex;
            height: calc(100vh - 52px);
            overflow: hidden;
        }

        /* ===== Sidebar ===== */
        #sidebar {
            width: 240px;
            min-width: 170px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
            flex-shrink: 0;
            overflow: hidden;
        }
        #sidebar.collapsed {
            width: 0;
            min-width: 0;
            border: none;
            padding: 0;
            overflow: hidden;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header #fileCount {
            color: var(--primary);
            background: var(--primary-dim);
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
        }
        #fileList {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            margin-bottom: 2px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.18s;
            border-left: 3px solid transparent;
            background: transparent;
            color: var(--text-secondary);
        }
        .file-item:hover {
            background: var(--bg-hover);
            color: var(--text);
        }
        .file-item.active {
            background: var(--bg-card);
            border-left-color: var(--primary);
            color: var(--text);
            font-weight: 600;
        }
        .file-item .name {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .file-item .del {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            padding: 0 4px;
            opacity: 0;
            transition: all 0.18s;
        }
        .file-item:hover .del { opacity: 0.6; }
        .file-item .del:hover { color: #f43f5e; opacity: 1; }

        .drop-zone {
            margin: 8px 10px 12px;
            padding: 14px 8px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.18s;
        }
        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--primary);
            background: var(--primary-dim);
            color: var(--primary);
        }

        /* ===== Workspace ===== */
        #workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            overflow: hidden;
        }
        .workspace-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 42px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 8px;
        }
        .workspace-header .file-label {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-metrics {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .workspace-actions {
            display: flex;
            gap: 4px;
        }
        .btn-mode {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s;
        }
        .btn-mode:hover {
            color: var(--text-secondary);
            border-color: var(--border);
        }
        .btn-mode.active {
            background: var(--bg-card);
            color: var(--primary);
            border-color: var(--border);
        }

        /* ===== Toolbar ===== */
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            padding: 6px 12px;
            background: var(--toolbar-bg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            align-items: center;
        }
        #toolbar button,
        #toolbar select {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.18s;
            font-family: var(--font);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 28px;
        }
        #toolbar button:hover {
            background: var(--bg-hover);
            color: var(--primary);
            border-color: var(--border);
        }
        #toolbar .separator {
            width: 1px;
            height: 18px;
            background: var(--border);
            margin: 0 4px;
        }

        /* ===== Content ===== */
        #workspaceContent {
            flex: 1;
            overflow: hidden;
            display: flex;
            background: var(--bg);
        }

        .editor-panel {
            display: flex;
            flex: 1;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--bg-secondary);
        }
        .editor-panel textarea {
            flex: 1;
            width: 100%;
            background: var(--bg);
            color: var(--text);
            border: none;
            padding: 20px;
            font-family: var(--font-mono);
            font-size: 13.5px;
            line-height: 1.65;
            resize: none;
            outline: none;
            transition: background 0.2s, color 0.2s;
        }

        .preview-panel {
            flex: 1;
            overflow-y: auto;
            padding: 32px 40px;
            background: var(--bg);
            font-family: var(--font);
            color: var(--text);
            line-height: 1.75;
            font-size: 15px;
            position: relative;
        }
        /* Estilos de preview */
        .preview-panel h1,
        .preview-panel h2,
        .preview-panel h3,
        .preview-panel h4,
        .preview-panel h5,
        .preview-panel h6 {
            font-family: var(--font);
            font-weight: 700;
            margin-top: 1.6em;
            margin-bottom: 0.4em;
            color: var(--text);
        }
        .preview-panel h1 {
            font-size: 1.95rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.35em;
            color: var(--primary);
        }
        .preview-panel h2 { font-size: 1.45rem; }
        .preview-panel h3 {
            font-size: 1.2rem;
            color: var(--text-secondary);
        }
        .preview-panel p { margin: 0.8em 0; }
        .preview-panel a {
            color: var(--primary);
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }
        .preview-panel a:hover { border-bottom-color: var(--primary); }
        .preview-panel blockquote {
            border-left: 3px solid var(--primary);
            padding: 0.6em 1.2em;
            margin: 1em 0;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            border-radius: 0 var(--radius) var(--radius) 0;
        }
        .preview-panel code {
            font-family: var(--font-mono);
            background: var(--bg-card);
            padding: 0.15em 0.4em;
            border-radius: 3px;
            font-size: 0.88em;
            border: 1px solid var(--border);
        }
        .preview-panel pre {
            background: var(--bg-card);
            padding: 1.1em 1.3em;
            border-radius: var(--radius);
            overflow-x: auto;
            border: 1px solid var(--border);
            margin: 1.2em 0;
            position: relative;
        }
        .preview-panel pre code {
            background: transparent;
            border: none;
            padding: 0;
        }
        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            font-family: var(--font);
        }
        .preview-panel pre:hover .copy-code-btn {
            opacity: 1;
        }
        .copy-code-btn:hover {
            background: var(--primary-dim);
            color: var(--primary);
            border-color: var(--primary);
        }

        .preview-panel table {
            border-collapse: collapse;
            width: 100%;
            margin: 1.2em 0;
            font-size: 0.92em;
        }
        .preview-panel th,
        .preview-panel td {
            border: 1px solid var(--border);
            padding: 0.6em 1em;
        }
        .preview-panel th {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Modos de visualización */
        .mode-view .editor-panel { display: none !important; }
        .mode-view .preview-panel { display: block !important; flex: 1; }
        .mode-edit .editor-panel { display: flex !important; flex: 1; }
        .mode-edit .preview-panel { display: none !important; }
        .mode-split .editor-panel { display: flex !important; flex: 1; }
        .mode-split .preview-panel { display: block !important; flex: 1; }

        /* ToC Drawer */
        #tocDrawer {
            position: absolute;
            right: 20px;
            top: 105px;
            width: 260px;
            max-height: 70vh;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 50;
            overflow-y: auto;
            display: none;
            font-size: 12px;
        }
        #tocDrawer h4 {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-family: var(--font-mono);
        }
        #tocList a {
            display: block;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 3px 0;
            font-family: var(--font);
        }
        #tocList a:hover { color: var(--primary); }

        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            width: 100%;
        }
        .welcome .big-icon {
            font-size: 36px;
            margin-bottom: 14px;
            color: var(--primary);
        }

        /* ===== Popup de Radios ===== */
        #radioPopup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        #radioPopup.visible {
            display: flex;
        }
        .radio-popup-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
        }
        .radio-popup-content h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }
        .radio-popup-content h2 i {
            color: var(--primary);
        }
        .radio-popup-content .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .radio-popup-content .close-btn:hover {
            color: var(--text);
        }
        .radio-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border-left: 3px solid var(--primary);
            transition: background 0.2s;
            text-decoration: none;
            color: var(--text-secondary);
        }
        .radio-item:hover {
            background: var(--bg-hover);
            color: var(--text);
        }
        .radio-item .radio-icon {
            font-size: 20px;
            width: 32px;
            text-align: center;
        }
        .radio-item .radio-name {
            font-weight: 500;
            flex: 1;
        }
        .radio-item .radio-badge {
            font-size: 10px;
            background: var(--primary-dim);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 10px;
        }
        .radio-item .radio-link {
            color: var(--text-muted);
            font-size: 14px;
            transition: color 0.2s;
        }
        .radio-item .radio-link:hover {
            color: var(--primary);
        }

        /* ===== Selector de idioma ===== */
        .lang-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2px 4px;
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: var(--font);
        }
        .lang-btn:hover {
            background: var(--bg-hover);
            color: var(--text);
        }
        .lang-btn.active {
            background: var(--primary-dim);
            color: var(--primary);
        }

        /* ===== Responsive ===== */
        @media (max-width: 900px) {
            #sidebar { width: 180px; min-width: 120px; }
            .preview-panel { padding: 20px; }
        }
        @media (max-width: 640px) {
            #sidebar { display: none; }
            .workspace-header { flex-wrap: wrap; height: auto; padding: 8px; }
            .hud-metrics { font-size: 10px; padding: 2px 6px; }
            .header-actions .btn-primary span { display: none; }
        }
    </style>
</head>
<body class="mode-split">

<header>
    <div class="logo">
        <div class="icon"><i class="fa-solid fa-cube"></i></div>
        <span class="title">NeoMark</span>
        <span class="badge-ver">v06</span>
    </div>
    <div class="header-actions">
        <!-- Toggle Sidebar -->
        <button id="toggleSidebarBtn" class="btn-icon" title="Toggle sidebar"><i class="fa-solid fa-bars"></i></button>

        <!-- Selector de idioma -->
        <div class="lang-selector" id="langSelector">
            <button class="lang-btn active" data-lang="es" title="Español">🇪🇸</button>
            <button class="lang-btn" data-lang="en" title="English">🇬🇧</button>
            <button class="lang-btn" data-lang="fr" title="Français">🇫🇷</button>
            <button class="lang-btn" data-lang="it" title="Italiano">🇮🇹</button>
            <button class="lang-btn" data-lang="de" title="Deutsch">🇩🇪</button>
            <button class="lang-btn" data-lang="cs" title="Čeština">🇨🇿</button>
            <button class="lang-btn" data-lang="ru" title="Русский">🇷🇺</button>
            <button class="lang-btn" data-lang="pl" title="Polski">🇵🇱</button>
            <button class="lang-btn" data-lang="zh" title="简体中文">🇨🇳</button>
            <button class="lang-btn" data-lang="zh-tw" title="繁體中文">🇹🇼</button>
            <button class="lang-btn" data-lang="ja" title="日本語">🇯🇵</button>
            <button class="lang-btn" data-lang="ko" title="한국어">🇰🇷</button>
        </div>

        <!-- Template Selector -->
        <select id="templateSelect" class="btn-primary" style="background:var(--bg-card);font-size:12px;max-width:120px;">
            <option value="">+ Template</option>
            <option value="readme">📄 README</option>
            <option value="report">📊 Report</option>
            <option value="api">🔌 API Docs</option>
            <option value="changelog">📝 Changelog</option>
            <option value="list">📋 Checklist</option>
            <option value="table">📊 Table</option>
            <option value="columns">📰 Columns</option>
        </select>

        <!-- Botón Radios -->
        <button id="radioBtn" class="btn-icon" title="Fungi Radios"><i class="fa-solid fa-radio"></i></button>

        <!-- Botón GitHub -->
        <a href="https://github.com/Colind8/Fungi-Radio" target="_blank" class="btn-icon" title="GitHub"><i class="fa-brands fa-github"></i></a>

        <button id="themeToggle" class="btn-icon" title="Toggle Theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
        <button id="tocBtn" class="btn-icon" title="Table of Contents"><i class="fa-solid fa-list-ul"></i></button>
        <button id="newBtn" class="btn-primary"><i class="fa-solid fa-plus"></i> <span>Nuevo</span></button>
        <button id="loadBtn" class="btn-primary"><i class="fa-solid fa-folder-open"></i> <span>Cargar</span></button>
        <input type="file" id="fileInput" multiple accept=".md,.markdown,text/markdown" style="display:none" />
    </div>
</header>

<main>
    <!-- Sidebar -->
    <aside id="sidebar">
        <div class="sidebar-header">

        // ===== DOM REFS =====
        const $ = s => document.querySelector(s);
        const $$ = s => document.querySelectorAll(s);

        const fileListEl = $('#fileList');
        const fileCountEl = $('#fileCount');
        const dropZone = $('#dropZone');
        const fileInput = $('#fileInput');
        const loadBtn = $('#loadBtn');
        const newBtn = $('#newBtn');
        const themeToggle = $('#themeToggle');

        const editorTextarea = $('#editorTextarea');
        const currentFileName = $('#currentFileName');

        const viewModeBtn = $('#viewModeBtn');
        const splitModeBtn = $('#splitModeBtn');
        const editModeBtn = $('#editModeBtn');
        const toolbar = $('#toolbar');
        const templateSelect = $('#templateSelect');
        const tocBtn = $('#tocBtn');
        const tocDrawer = $('#tocDrawer');
        const tocList = $('#tocList');
        const toggleSidebarBtn = $('#toggleSidebarBtn');
        const sidebar = $('#sidebar');
        const radioBtn = $('#radioBtn');
        const radioPopup = $('#radioPopup');
        const closeRadioPopup = $('#closeRadioPopup');
        const radioList = $('#radioList');
        const langSelector = $('#langSelector');

        // ===== PERSISTENCIA =====
        function saveSession() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    files: state.files,
                    selected: state.selected,
                    theme: state.theme,
                    mode: state.mode,
                    sidebarVisible: state.sidebarVisible,
                    lang: state.lang
                }));
            } catch (e) { /* ignore */ }
        }

        function loadSession() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return false;
                const data = JSON.parse(raw);
                state.files = data.files || {};
                state.selected = data.selected || null;
                state.theme = data.theme || 'dark';
                state.mode = data.mode || 'split';
                state.sidebarVisible = data.sidebarVisible !== undefined ? data.sidebarVisible : true;
                state.lang = data.lang || 'es';
                if (state.theme === 'light') document.body.classList.add('light');
                return Object.keys(state.files).length > 0;
            } catch (e) { return false; }
        }

        // ===== IDIOMA =====
        function setLanguage(lang) {
            state.lang = lang;
            // Actualizar botones
            langSelector.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            // Aplicar traducciones
            const t = i18n[lang] || i18n.es;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (t[key] !== undefined) {
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = t[key];
                    } else {
                        el.textContent = t[key];
                    }
                }
            });
            // Actualizar elementos que no tienen data-i18n
            const welcomeTitle = welcomePlaceholder.querySelector('h2');
            if (welcomeTitle) welcomeTitle.textContent = t.welcome_title;
            const welcomeDesc = welcomePlaceholder.querySelector('p');
            if (welcomeDesc) welcomeDesc.textContent = t.welcome_desc;
            // Botones
            newBtn.innerHTML = `<i class="fa-solid fa-plus"></i> <span>${t.nuevo}</span>`;
            loadBtn.innerHTML = `<i class="fa-solid fa-folder-open"></i> <span>${t.cargar}</span>`;
            viewModeBtn.textContent = t.vista;
            editModeBtn.textContent = t.editar;
            // Sidebar
            document.querySelector('.sidebar-header span:first-child').textContent = t.archivos;
            dropZone.querySelector('span').textContent = t.arrastrar;
            // HUD
            // ya se actualiza con los números
            // Template select
            templateSelect.options[0].text = t.template_label;
            // Export
            $('#exportMdBtn').innerHTML = `<i class="fa-solid fa-download"></i> ${t.exportar}`;
            $('#copyHtmlBtn').innerHTML = `<i class="fa-solid fa-copy"></i> ${t.copiar_html}`;
            // Radio popup
            document.querySelector('#radioPopup h2').innerHTML = `<i class="fa-solid fa-radio"></i> ${t.radio_title}`;
            const repoLink = document.querySelector('#radioPopup .repo-link');
            if (repoLink) repoLink.textContent = t.repo_link;
            saveSession();
        }

        // ===== HUD =====
        function updateHUD(text) {
            const t = i18n[state.lang] || i18n.es;
            if (!text) {
                $('#hudWords').textContent = '0';
                $('#hudChars').textContent = '0';
                $('#hudTime').textContent = `0m`;
                return;
            }
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            const readTime = Math.max(1, Math.ceil(words / 200));
            $('#hudWords').textContent = words.toLocaleString();
            $('#hudChars').textContent = chars.toLocaleString();
            $('#hudTime').textContent = `${readTime}m`;
        }

        // ===== TOC =====
        function generateTOC() {
            const headings = previewPanel.querySelectorAll('h1, h2, h3');
            tocList.innerHTML = '';
            if (!headings.length) {
                tocList.innerHTML = '<span style="color:var(--text-muted);">No headings found</span>';
                return;
            }
            headings.forEach((h, idx) => {
                const id = `heading-${idx}`;
                h.id = id;
                const a = document.createElement('a');
                a.href = `#${id}`;
                a.textContent = h.textContent;
                const level = parseInt(h.tagName[1]);
                a.style.paddingLeft = (level - 1) * 14 + 'px';
                a.onclick = (e) => {
                    e.preventDefault();
                    h.scrollIntoView({ behavior: 'smooth' });
                    tocDrawer.style.display = 'none';
                };
                tocList.appendChild(a);
            });
        }

        // ===== COPY CODE BUTTONS =====
        function addCopyButtonsToCodeBlocks() {
            const pres = previewPanel.querySelectorAll('pre');
            pres.forEach(pre => {
                if (pre.querySelector('.copy-code-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'copy-code-btn';
                btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copiar';
                btn.title = 'Copiar código';
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const code = pre.querySelector('code');
                    const text = code ? code.textContent : pre.textContent;
                    navigator.clipboard.writeText(text).then(() => {
                        const original = btn.innerHTML;
                        btn.innerHTML = '<i class="fa-regular fa-check"></i> ¡Copiado!';
                        setTimeout(() => btn.innerHTML = original, 1500);
                    }).catch(() => {
                        const area = document.createElement('textarea');
                        area.value = text;
                        document.body.appendChild(area);
                        area.select();
                        document.execCommand('copy');
                        area.remove();
                        const original = btn.innerHTML;
                        btn.innerHTML = '<i class="fa-regular fa-check"></i> ¡Copiado!';
                        setTimeout(() => btn.innerHTML = original, 1500);
                    });
                });
                pre.style.position = 'relative';
                pre.appendChild(btn);
            });
        }

        // ===== RENDER PREVIEW =====
        function renderPreview(md) {
            if (!md || md.trim() === '') {
                const t = i18n[state.lang] || i18n.es;
                previewPanel.innerHTML = `<div style="color:var(--text-muted);padding:40px;text-align:center;font-size:13px;">${t.vacio}</div>`;
                updateHUD('');
                return;
            }
            try {
                previewPanel.innerHTML = marked.parse(md);
                previewPanel.querySelectorAll('pre code').forEach(block => {
                    hljs.highlightElement(block);
                });
                addCopyButtonsToCodeBlocks();
                updateHUD(md);
                generateTOC();
            } catch (e) {
                previewPanel.innerHTML = `<div style="color:#f43f5e;padding:20px;">Error: ${e.message}</div>`;
            }
        }

        // ===== SELECT FILE =====
        function selectFile(key) {
            if (!state.files[key]) return;
            state.selected = key;
            renderFileList();
            const f = state.files[key];
            currentFileName.textContent = f.name;
            welcomePlaceholder.style.display = 'none';
            editorTextarea.value = f.content;
            renderPreview(f.content);
            applyMode(state.mode);
            saveSession();
        }

        // ===== CREATE NEW FILE =====
        function createNewFile(name = 'document.md', content = '') {
            let key = name;
            let counter = 1;
            while (state.files[key]) {
                key = `document_${counter}.md`;
                counter++;
            }
            state.files[key] = { name: key, content: content };
            renderFileList();
            selectFile(key);
            applyMode('split');
            saveSession();
        }

        // ===== RENDER FILE LIST =====
        function renderFileList() {
            const keys = Object.keys(state.files);
            const t = i18n[state.lang] || i18n.es;
            fileCountEl.textContent = keys.length;
            if (!keys.length) {
                fileListEl.innerHTML = `<div style="padding:15px;color:var(--text-muted);font-size:12px;text-align:center;">${t.sin_archivos}</div>`;
                return;
            }
            let html = '';
            keys.forEach(k => {
                const active = k === state.selected ? 'active' : '';
                html += `<div class="file-item ${active}" data-key="${k}">
                    <span class="name"><i class="fa-regular fa-file-lines"></i> ${k}</span>
                    <button class="del" data-key="${k}">×</button>
                </div>`;
            });
            fileListEl.innerHTML = html;
            fileListEl.querySelectorAll('.file-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('del')) return;
                    selectFile(item.dataset.key);
                });
                item.querySelector('.del').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const key = item.dataset.key;
                    delete state.files[key];
                    if (state.selected === key) state.selected = null;
                    renderFileList();
                    if (Object.keys(state.files).length) {
                        selectFile(Object.keys(state.files)[0]);
                    } else {
                        welcomePlaceholder.style.display = 'flex';
                        currentFileName.textContent = t.ninguno;
                        editorTextarea.value = '';
                        previewPanel.innerHTML = '';
                        updateHUD('');
                    }
                    saveSession();
                });
            });
        }

        // ===== LOAD FILES =====
        function loadFiles(files) {
            Array.from(files).forEach(f => {
                const reader = new FileReader();
                reader.onload = e => {
                    state.files[f.name] = { name: f.name, content: e.target.result };
                    renderFileList();
                    selectFile(f.name);
                };
                reader.readAsText(f);
            });
        }

        // ===== APPLY MODE =====
        function applyMode(mode) {
            state.mode = mode;
            document.body.className = `mode-${mode} ${state.theme}`;
            viewModeBtn.classList.toggle('active', mode === 'view');
            splitModeBtn.classList.toggle('active', mode === 'split');
            editModeBtn.classList.toggle('active', mode === 'edit');
            saveSession();
        }

        // ===== TOGGLE SIDEBAR =====
        function toggleSidebar() {
            state.sidebarVisible = !state.sidebarVisible;
            sidebar.classList.toggle('collapsed', !state.sidebarVisible);
            saveSession();
        }

        // ===== APPLY FORMAT =====
        function applyFormat(format) {
            const ta = editorTextarea;
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const selectedText = ta.value.substring(start, end);
            let replacement = '';
            switch (format) {
                case 'bold':
                    replacement = `**${selectedText || 'texto en negrita'}**`;
                    break;
                case 'italic':
                    replacement = `*${selectedText || 'texto en cursiva'}*`;
                    break;
                case 'strike':
                    replacement = `~~${selectedText || 'texto tachado'}~~`;
                    break;
                case 'h1':
                    replacement = `# ${selectedText || 'Título 1'}`;
                    break;
                case 'h2':
                    replacement = `## ${selectedText || 'Título 2'}`;
                    break;
                case 'h3':
                    replacement = `### ${selectedText || 'Título 3'}`;
                    break;
                case 'ul':
                    replacement = `- ${selectedText || 'elemento de lista'}`;
                    break;
                case 'ol':
                    replacement = `1. ${selectedText || 'elemento ordenado'}`;
                    break;
                case 'checklist':
                    replacement = `- [ ] ${selectedText || 'tarea'}`;
                    break;
                case 'code':
                    replacement = `\`${selectedText || 'código'}\``;
                    break;
                case 'codeblock':
                    replacement = `\`\`\`javascript\n${selectedText || '// código aquí'}\n\`\`\``;
                    break;
                case 'blockquote':
                    replacement = `> ${selectedText || 'cita'}`;
                    break;
                case 'link':
                    replacement = `[${selectedText || 'texto del enlace'}](https://ejemplo.com)`;
                    break;
                case 'image':
                    replacement = `![${selectedText || 'texto alternativo'}](https://ejemplo.com/imagen.jpg)`;
                    break;
                default:
                    return;
            }
            const before = ta.value.substring(0, start);
            const after = ta.value.substring(end);
            ta.value = before + replacement + after;
            const newPos = start + replacement.length;
            ta.selectionStart = ta.selectionEnd = newPos;
            ta.focus();

            if (state.selected) {
                state.files[state.selected].content = ta.value;
                renderPreview(ta.value);
                saveSession();
            }
        }

        // ===== RADIO LIST (desde el repo) =====
        // Hardcodeamos algunas radios de ejemplo basadas en el README del repo
        const DEFAULT_RADIOS = [
            { id: 'PLGgeOJev8QMT_4I6NP_BmgSUpQkiTddNf', name: 'Fungi Radio', section: 'Main', icon: '🍄' },
            { id: 'PLGgeOJev8QMT_4I6NP_BmgSUpQkiTddNf', name: 'Fungi Radio 2000', section: 'Main', icon: '🎧' },
            { id: 'PLGgeOJev8QMT_4I6NP_BmgSUpQkiTddNf', name: 'Electronic Vibes', section: 'Electronic', icon: '🎵' },
            { id: 'PLGgeOJev8QMT_4I6NP_BmgSUpQkiTddNf', name: 'Lo-Fi Beats', section: 'Chill', icon: '☕' },
            { id: 'PLGgeOJev8QMT_4I6NP_BmgSUpQkiTddNf', name: 'Rock Classics', section: 'Rock', icon: '🎸' },
            { id: 'PLGgeOJev8QMT_4I6NP_BmgSUpQkiTddNf', name: 'Jazz Sessions', section: 'Jazz', icon: '🎷' },
        ];

        function renderRadioList(radios = DEFAULT_RADIOS) {
            radioList.innerHTML = '';
            // Agrupar por sección
            const sections = {};
            radios.forEach(r => {
                if (!sections[r.section]) sections[r.section] = [];
                sections[r.section].push(r);
            });
            for (const [section, items] of Object.entries(sections)) {
                const secDiv = document.createElement('div');
                secDiv.style.marginTop = '8px';
                const secTitle = document.createElement('div');
                secTitle.style.cssText = 'font-size:11px;text-transform:uppercase;color:var(--text-muted);letter-spacing:1px;padding:4px 0 6px 0;border-bottom:1px solid var(--border);';
                secTitle.textContent = section;
                secDiv.appendChild(secTitle);
                items.forEach(r => {
                    const a = document.createElement('a');
                    a.className = 'radio-item';
                    a.href = `https://colind8.neocities.org/radio`;
                    a.target = '_blank';
                    a.innerHTML = `
                        <span class="radio-icon">${r.icon || '📻'}</span>
                        <span class="radio-name">${r.name}</span>
                        <span class="radio-badge">${r.section}</span>
                        <span class="radio-link"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
                    `;
                    secDiv.appendChild(a);
                });
                radioList.appendChild(secDiv);
            }
        }

        // ===== PLANTILLAS MEJORADAS =====
        function getTemplate(type) {
            const date = new Date().toISOString().split('T')[0];
            switch (type) {
                case 'readme':
                    return `# Project Name\n\n> Short description.\n\n## Features\n- Feature 1\n- Feature 2\n\n## Installation\n\`\`\`bash\nnpm install\n\`\`\`\n`;
                case 'report':
                    return `# DIAGNOSTIC REPORT\n**Date:** ${date}\n\n## Summary\n| Status | Module | Issue |\n| :--- | :--- | :--- |\n| 🔴 CRITICAL | Core | Memory Leak |\n| 🟡 WARNING | UI | Slow render |\n`;
                case 'api':
                    return `# API Documentation\n\n## GET /users\nReturns a list of users.\n\n### Parameters\n| Name | Type | Description |\n| :--- | :--- | :--- |\n| page | integer | Page number |\n\n### Response\n\`\`\`json\n{ "users": [] }\n\`\`\`\n`;
                case 'changelog':
                    return `# Changelog\n\n## [1.2.0] - ${date}\n### Added\n- New feature\n### Fixed\n- Bug fix\n`;
                case 'list':
                    return `# Task List\n\n## Pending\n- [ ] Task 1\n- [ ] Task 2\n- [ ] Task 3\n\n## In Progress\n- [ ] Task 4\n\n## Done\n- [x] Task 5\n- [x] Task 6\n`;
                case 'table':
                    return `# Data Table\n\n| Name | Age | City |\n| :--- | :--- | :--- |\n| Alice | 30 | Madrid |\n| Bob | 25 | Barcelona |\n| Carol | 35 | Valencia |\n`;
                case 'columns':
                    return `# Two Columns\n\n<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">\n\n## Column 1\n\nContent for the first column.\n\n- Item A\n- Item B\n\n## Column 2\n\nContent for the second column.\n\n- Item C\n- Item D\n\n</div>\n`;
                default:
                    return '';
            }
        }

        // ===== INICIALIZACIÓN =====
        function init() {
            // Cargar sesión
            const restored = loadSession();
            if (restored && state.selected && state.files[state.selected]) {
                renderFileList();
                selectFile(state.selected);
                if (!state.sidebarVisible) {
                    sidebar.classList.add('collapsed');
                }
            } else {
                renderFileList();
                applyMode('split');
                if (Object.keys(state.files).length === 0) {
                    welcomePlaceholder.style.display = 'flex';
                }
            }

            // Aplicar idioma
            setLanguage(state.lang);

            // Renderizar radios
            renderRadioList();

            // ===== EVENTOS =====

            // Cargar archivos
            loadBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', e => {
                if (e.target.files.length) {
                    loadFiles(e.target.files);
                    fileInput.value = '';
                }
            });

            // Nuevo
            newBtn.addEventListener('click', () => createNewFile());

            // Drop zone
            dropZone.addEventListener('click', () => fileInput.click());
            dropZone.addEventListener('dragover', e => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
            dropZone.addEventListener('drop', e => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files);
            });

            // Modos
            viewModeBtn.addEventListener('click', () => applyMode('view'));
            splitModeBtn.addEventListener('click', () => applyMode('split'));
            editModeBtn.addEventListener('click', () => applyMode('edit'));

            // Tema
            themeToggle.addEventListener('click', () => {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                document.body.classList.toggle('light', state.theme === 'light');
                applyMode(state.mode);
            });

            // ToC
            tocBtn.addEventListener('click', () => {
                tocDrawer.style.display = tocDrawer.style.display === 'block' ? 'none' : 'block';
            });

            // Toggle sidebar
            toggleSidebarBtn.addEventListener('click', toggleSidebar);

            // Editor input
            editorTextarea.addEventListener('input', () => {
                if (state.selected) {
                    const val = editorTextarea.value;
                    state.files[state.selected].content = val;
                    renderPreview(val);
                    saveSession();
                }
            });

            // Toolbar buttons
            toolbar.querySelectorAll('button[data-format]').forEach(btn => {
                btn.addEventListener('click', () => {
                    applyFormat(btn.dataset.format);
                });
            });

            // Copy HTML
            $('#copyHtmlBtn').addEventListener('click', () => {
                const html = previewPanel.innerHTML;
                navigator.clipboard.writeText(html).then(() => {
                    alert('HTML copiado al portapapeles.');
                }).catch(() => {
                    const area = document.createElement('textarea');
                    area.value = html;
                    document.body.appendChild(area);
                    area.select();
                    document.execCommand('copy');
                    area.remove();
                    alert('HTML copiado (fallback).');
                });
            });

            // Export MD
            $('#exportMdBtn').addEventListener('click', () => {
                if (!state.selected) return;
                const content = state.files[state.selected].content;
                const blob = new Blob([content], { type: 'text/markdown' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = state.selected;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            });

            // Plantillas
            templateSelect.addEventListener('change', () => {
                const val = templateSelect.value;
                if (!val) return;
                const tpl = getTemplate(val);
                if (tpl) {
                    createNewFile(`${val}_template.md`, tpl);
                }
                templateSelect.value = '';
            });

            // Radio Popup
            radioBtn.addEventListener('click', () => {
                radioPopup.classList.toggle('visible');
            });
            closeRadioPopup.addEventListener('click', () => {
                radioPopup.classList.remove('visible');
            });
            radioPopup.addEventListener('click', (e) => {
                if (e.target === radioPopup) radioPopup.classList.remove('visible');
            });

            // Idioma
            langSelector.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setLanguage(btn.dataset.lang);
                });
            });

            // ===== ATAJOS DE TECLADO =====
            editorTextarea.addEventListener('keydown', (e) => {
                const ctrl = e.ctrlKey || e.metaKey;
                if (!ctrl) return;

                const key = e.key.toLowerCase();
                let format = null;

                if (key === 'b') format = 'bold';
                else if (key === 'i') format = 'italic';
                else if (key === 'u') format = 'strike';
                else if (key === '1') format = 'h1';
                else if (key === '2') format = 'h2';
                else if (key === '3') format = 'h3';
                else if (key === 'l') format = 'link';

                if (e.key === '`' && !e.shiftKey) {
                    e.preventDefault();
                    applyFormat('code');
                    return;
                }
                if (e.key === 'c' && e.shiftKey) {
                    e.preventDefault();
                    applyFormat('codeblock');
                    return;
                }

                if (format) {
                    e.preventDefault();
                    applyFormat(format);
                }
            });
        }

        init();
    })();
</script>
</body>
</html>
