<script>
(function(){
  const tracks=[
    {name:'NEON MEMORY',root:110,scale:[0,3,5,7,10],bpm:72,cut:1150},
    {name:'TERMINAL RAIN',root:98,scale:[0,2,3,7,9],bpm:68,cut:900},

  let ctx=null,master=null,pad=[],noise=null,noiseGain=null,filter=null,lfo=null,lfoGain=null,timer=null,step=0,idx=0;
  let volume=parseFloat(localStorage.getItem('neomark_ambient_volume')||'0.16');

  function hz(root,semitones){return root*Math.pow(2,semitones/12)}
  function make(ctx, type, freq, gain, detune){

    o.type=type;o.frequency.value=freq;o.detune.value=detune||0;g.gain.value=gain;o.connect(g);g.connect(filter);o.start();return o;

    schedule();
  }
  function schedule(){

      g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.012,now+.018);g.gain.exponentialRampToValueAtTime(.0001,now+.18);
      o.connect(g);g.connect(filter);o.start(now);o.stop(now+.2);step++;
    },ms);
  }
  function updateTrack(){
    ui.name.textContent=tracks[idx].name;step=0;
    if(!ctx)return;
    const t=tracks[idx];
    filter.frequency.setTargetAtTime(t.cut,ctx.currentTime,.08);

})();
